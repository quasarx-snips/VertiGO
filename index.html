<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <title>VertiGO</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/hud.css" />
  </head>
  <body>
    <canvas id="tower"></canvas>

    <div id="hud">
      <p id="hud-clock"><span id="clock">00:00.00</span><span id="floor"></span></p>
      <p id="hud-shards" hidden>
        <span aria-hidden="true">&#9670;</span> <span id="shard-count">0/0</span>
      </p>
      <p id="hud-spin"><span id="spin-value">0.0</span><span>m/s</span></p>
      <div id="spin-meter" aria-hidden="true"><span id="spin-fill"></span></div>
    </div>

    <div id="touch-pad">
      <div id="touch-orbit">
        <button type="button" data-action="left" aria-label="orbit left">&#9664;</button>
        <button type="button" data-action="right" aria-label="orbit right">&#9654;</button>
      </div>
      <button type="button" id="touch-jump" data-action="jump" aria-label="jump">&#9679;</button>
    </div>

    <pre id="dev-overlay" hidden></pre>
    <div id="test-output" hidden></div>

    <script src="src/vendor/three.min.js"></script>
    <script type="module" src="src/boot.js"></script>
    <script type="module">
      if (new URLSearchParams(location.search).has('proof'))
        import('./tools/capture.js')
          .then((module) => module.setupCapture())
          .catch((error) => {
            const overlay = document.getElementById('dev-overlay');
            overlay.hidden = false;
            overlay.textContent = 'capture failed: ' + error.message;
          });
    </script>
  </body>
</html>
